services:
  testdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: colorwin_test
      POSTGRES_USER: colorwin_test
      POSTGRES_PASSWORD: colorwin_test
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colorwin_test -d colorwin_test"]
      interval: 5s
      timeout: 5s
      retries: 10
