name: Production Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colorwin-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Re-run backend verification
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run tests and package
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress clean verify

  deploy:
    name: Deploy to Render (approval required)
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || {
            echo "Missing production environment secret: RENDER_DEPLOY_HOOK_URL"
            exit 1
          }
          curl --connect-timeout 10 --max-time 30 --fail --silent --show-error \
            --request POST "$RENDER_DEPLOY_HOOK_URL" \
            --output /dev/null
          echo "Render deploy hook accepted the request. Verify deployment health in Render."
