limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=money_zone:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

server {
    listen 80;
    server_name millionairehub.tech www.millionairehub.tech;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://millionairehub.tech$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.millionairehub.tech;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/millionairehub.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/millionairehub.tech/privkey.pem;

    return 301 https://millionairehub.tech$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name millionairehub.tech;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/millionairehub.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/millionairehub.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 5m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_conn conn_zone 30;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=auth_zone burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/(deposits|withdraw-agent|admin/withdrawals) {
        limit_req zone=money_zone burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=api_zone burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
