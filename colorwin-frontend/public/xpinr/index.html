<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#120a2e">
<title>Coin Spin</title>

<!--
  COIN SPIN — single-file mobile-first game. Virtual coins only: no real money, no payments.

  SETUP NOTES (Mesh2Motion mascot)
  1. Open https://app.mesh2motion.org and pick a model (or import your own mesh and rig it).
  2. Add animations: at least an Idle, one happy clip (Jump / Run / Walk / Dance), one sad clip (Death / Sit).
  3. Export as GLB (glTF Binary) with animations included.
  4. Save the file as "mascot.glb" in the SAME folder as this HTML file
     (or change CONFIG.MASCOT_GLB below to any path/URL).
  5. Serve the folder over HTTP — browsers block loading the GLB from file:// :
       python3 -m http.server 8000      then open  http://localhost:8000/coin-spin.html
  If the GLB is missing or WebGL / the CDN is unavailable, the built-in animated cartoon girl is used and the game still works.
  (MASCOT_GLB is empty by default = built-in girl. Set it to "./girl.glb" to use a Mesh2Motion character instead.)
-->

<!-- Three.js pinned to an exact version; loaded lazily so the game works even if the CDN fails -->

} }
</script>

<style>
  :root{
    --bg1:#2a1370; --bg2:#0c0a22; --card:rgba(255,255,255,.07);
    --gold:#ffc400; --text:#fff; --muted:#a9a3d6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
    background:radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2) 70%);
    color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none}
  button{font:inherit;color:inherit;border:0;cursor:pointer}
  button:disabled{cursor:not-allowed}

  #app{max-width:560px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));gap:8px}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:10px}
  .pill{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid rgba(255,255,255,.12);
    border-radius:999px;padding:6px 14px 6px 8px}
  .coin{width:30px;height:30px;flex:none;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff7b0,#ffc400 55%,#c98600);
    box-shadow:inset 0 0 0 3px #e6a500,inset 0 0 0 5px #ffe27a,0 2px 6px rgba(0,0,0,.4)}
  #balance{font-size:clamp(22px,6.5vw,30px);font-weight:900;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .bump{animation:bump .3s ease}
  @keyframes bump{50%{transform:scale(1.25)}}
  .best{margin-left:auto;text-align:right;font-size:11px;color:var(--muted);letter-spacing:1px;line-height:1.2}
  .best b{display:block;font-size:16px;color:var(--gold);letter-spacing:0}
  #mute{width:42px;height:42px;border-radius:50%;background:var(--card);border:1px solid rgba(255,255,255,.12);font-size:20px}

  /* ---------- mascot + history ---------- */
  .top{display:flex;gap:12px;align-items:stretch}
  #mascot{position:relative;width:clamp(84px,24vw,112px);aspect-ratio:1;flex:none;border-radius:18px;
    background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.12);overflow:hidden}
  #mascotCanvas{position:absolute;inset:0;width:100%;height:100%;display:none}
  #mascotEmoji{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(44px,13vw,64px);
    animation:bob 2.2s ease-in-out infinite}
  #mascotEmoji.happy{animation:hop .45s ease-in-out 4}
  #mascotEmoji.sad{animation:droop 1.6s ease forwards}
  @keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}
  @keyframes hop{50%{transform:translateY(-16px) scale(1.12) rotate(6deg)}}
  @keyframes droop{30%,80%{transform:translateY(8px) rotate(-14deg) scale(.92);filter:grayscale(.7)}100%{transform:none;filter:none}}
  .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .lbl{font-size:11px;letter-spacing:2px;color:var(--muted)}
  #history{display:flex;gap:6px}
  .chip{flex:1;max-width:58px;text-align:center;padding:6px 0;border-radius:10px;font-weight:900;font-size:13px;
    background:rgba(255,255,255,.06);color:var(--muted);border:1px dashed rgba(255,255,255,.18)}
  .chip.f{border:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
  #status{font-size:14px;min-height:36px;color:#e9e6ff;font-weight:700;line-height:1.25}

  /* ---------- wheel ---------- */
  #stage{flex:1;min-height:0;display:grid;place-items:center}
  #wheelBox{position:relative;width:max(230px,min(92vw,calc(100dvh - 340px),520px));aspect-ratio:1;cursor:pointer}
  #wheelBox.locked{cursor:default}
  #wheelShake{position:absolute;inset:3% 0 0 0;border-radius:50%;filter:drop-shadow(0 10px 24px rgba(0,0,0,.55))}
  #wheelShake.shake{animation:shake .55s ease}
  #wheelShake.shake-soft{animation:shake .4s ease;animation-iteration-count:1}
  @keyframes shake{10%,90%{transform:translateX(-5px)}20%,80%{transform:translateX(9px) rotate(1deg)}
    30%,50%,70%{transform:translateX(-12px) rotate(-1.5deg)}40%,60%{transform:translateX(12px) rotate(1.5deg)}}
  #wheelRot{width:100%;height:100%;will-change:transform}
  #wheel{width:100%;height:100%;display:block}
  #pointer{position:absolute;z-index:3;left:50%;top:-1%;width:10%;height:13%;margin-left:-5%;
    transform-origin:50% 18%;background:linear-gradient(#fff,#ffd54a 40%,#e69500);
    clip-path:polygon(50% 100%,0 22%,18% 0,82% 0,100% 22%);filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))}
  #hub{position:absolute;z-index:2;left:50%;top:51.5%;width:23%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;font-weight:900;font-size:clamp(14px,4.4vw,24px);letter-spacing:1px;color:#3b2500;
    background:radial-gradient(circle at 35% 30%,#fff7b0,#ffc400 55%,#d18a00);
    box-shadow:0 0 0 4px #7a4b00,0 0 0 7px #ffe27a,0 6px 14px rgba(0,0,0,.5);animation:pulse 1.4s ease-in-out infinite}
  #hub:disabled{animation:none;filter:grayscale(.6) brightness(.8)}
  @keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08)}}

  /* ---------- bets ---------- */
  footer{display:flex;flex-direction:column;gap:6px}
  #betLabel{text-align:center;font-size:12px;letter-spacing:2px;color:var(--muted)}
  #bets{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
  .bet{padding:14px 0;border-radius:14px;font-weight:900;font-size:clamp(14px,4vw,18px);
    background:linear-gradient(#4a3a9c,#2e2370);box-shadow:0 4px 0 #1a1347;transition:transform .1s}
  .bet:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #1a1347}
  .bet.sel{background:linear-gradient(#ffd54a,#f29d00);color:#3b2500;box-shadow:0 4px 0 #9a5f00,0 0 16px rgba(255,196,0,.55)}
  .bet.all{background:linear-gradient(#ff6b6b,#c62828);box-shadow:0 4px 0 #6d1212;font-size:clamp(11px,3.2vw,15px)}
  .bet.all.sel{background:linear-gradient(#ff9a9a,#ff3d3d);color:#fff;box-shadow:0 4px 0 #8a1c1c,0 0 16px rgba(255,80,80,.7)}
  .bet:disabled{opacity:.35;filter:grayscale(.5)}

  /* ---------- effects ---------- */
  #confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
  #floats{position:fixed;inset:0;pointer-events:none;z-index:40}
  .float{position:absolute;transform:translate(-50%,-50%);font-weight:900;white-space:nowrap;
    font-size:clamp(30px,10vw,54px);text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 18px currentColor;animation:floatUp 1.5s ease-out forwards}
  .float.big{font-size:clamp(38px,13vw,72px)}
  @keyframes floatUp{0%{opacity:0;transform:translate(-50%,-20%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}
    30%{transform:translate(-50%,-60%) scale(1)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
  .flycoin{position:fixed;z-index:45;width:26px;height:26px;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle at 35% 30%,#fff7b0,#ffc400 55%,#c98600);box-shadow:inset 0 0 0 3px #e6a500,0 2px 6px rgba(0,0,0,.4)}
  #flash{position:fixed;inset:0;z-index:35;pointer-events:none;opacity:0}

  /* ---------- game over ---------- */
  #over{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(6,4,24,.85);backdrop-filter:blur(4px);padding:20px}
  #over.show{display:grid}
  .card{width:min(360px,100%);text-align:center;padding:26px 20px;border-radius:24px;
    background:linear-gradient(#2c1f78,#170f47);border:1px solid rgba(255,255,255,.18);box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .card h2{margin:0 0 6px;font-size:34px;color:#ff6b6b;letter-spacing:1px}
  .card p{margin:4px 0 18px;color:var(--muted)}
  .btn{display:block;width:100%;padding:15px;margin-top:10px;border-radius:16px;font-weight:900;font-size:18px}
  .btn.primary{background:linear-gradient(#ffd54a,#f29d00);color:#3b2500;box-shadow:0 4px 0 #9a5f00}
  .btn.green{background:linear-gradient(#5be36f,#1f9d36);box-shadow:0 4px 0 #11641f}
  .btn:disabled{opacity:.45;filter:grayscale(.6)}
  .note{font-size:11px;color:var(--muted);margin-top:10px}

  @media (prefers-reduced-motion:reduce){#hub,#mascotEmoji{animation:none!important}}
</style>
<style id="luxe">
/* ================= LUXE THEME (overrides) ================= */
:root{--gold:#ffd36b;--line:rgba(255,215,120,.38)}

.best b{font-family:Georgia,serif;text-shadow:0 0 12px rgba(255,190,60,.5)}

.top{align-items:center}

  background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--line);
  backdrop-filter:blur(8px);box-shadow:0 6px 16px rgba(0,0,0,.3)}
#status::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:0;border-right-color:rgba(255,215,120,.45)}
.lbl{color:#d9c58a}
.chip{background:rgba(255,255,255,.07);border:1px dashed rgba(255,215,120,.28)}

@keyframes chipIn{from{transform:scale(.4);opacity:0}}

/* wheel */
#wheelBox{width:max(220px,min(92vw,calc(100dvh - 396px),500px))}
#wheelBox::before{content:"";position:absolute;inset:-6%;border-radius:50%;filter:blur(20px);opacity:.55;
  background:conic-gradient(from 0deg,#ffd36b,#ff2e93,#7b4dff,#29d3ff,#ffd36b);animation:haloSpin 10s linear infinite}

@keyframes ripple{from{transform:scale(.92);opacity:.95}to{transform:scale(1.38);opacity:0}}
#hub{position:absolute;overflow:hidden;font-family:Georgia,"Times New Roman",serif;text-shadow:0 1px 0 rgba(255,255,255,.7);

  background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.04));
  box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);backdrop-filter:blur(8px)}

/* game over card */
.card{border:1px solid var(--line);background:linear-gradient(180deg,#2d1670,#110929);
  box-shadow:0 30px 80px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,215,120,.15),0 0 70px rgba(255,170,0,.18);
  animation:cardIn .55s cubic-bezier(.2,1.3,.4,1) both}
@keyframes cardIn{from{transform:scale(.8) translateY(24px);opacity:0}}
.card h2{background:linear-gradient(#fff7cf,#ff7a7a 90%);-webkit-background-clip:text;background-clip:text;color:transparent;font-family:Georgia,serif}
.float{font-family:Georgia,"Times New Roman",serif}

/* ================= CARTOON GIRL ================= */
#girl{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
#girl .bodyG{transform-origin:100px 244px;animation:breathe 3.2s ease-in-out infinite}
#girl .hm{transform-origin:100px 142px;animation:headIdle 4.2s ease-in-out infinite}
#girl .armL{transform-origin:72px 162px;animation:armIdleL 3.6s ease-in-out infinite}
#girl .armR{transform-origin:128px 162px;animation:armIdleR 3.6s ease-in-out infinite}
#girl .lockL{transform-origin:56px 92px;animation:lock 3.4s ease-in-out infinite}
#girl .lockR{transform-origin:144px 92px;animation:lock 3.4s ease-in-out -1.2s infinite reverse}
#girl .eyeL{transform-origin:80px 100px}#girl .eyeR{transform-origin:120px 100px}
#girl .eye{animation:blink 4.6s infinite}
#girl .eyesH,#girl .mH,#girl .mS,#girl .tear,#girl .sp{opacity:0}
#girl .mN,#girl .eye,#girl .blush{transition:opacity .2s}
#girl .blush{opacity:.5}
#girl .brow{transition:transform .35s}
#girl .browL{transform-origin:80px 79px}#girl .browR{transform-origin:120px 79px}
#girl .sp,#girl .tear,#girl .gshadow{transform-box:fill-box;transform-origin:center}

@keyframes breathe{50%{transform:translateY(-3px)}}
@keyframes headIdle{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
@keyframes armIdleL{50%{transform:rotate(4deg)}}
@keyframes armIdleR{50%{transform:rotate(-4deg)}}
@keyframes lock{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}

/* watching the wheel spin */
#girl.spin .bodyG{animation:excite .55s ease-in-out infinite}
#girl.spin .armL{animation:armWatchL .55s ease-in-out infinite alternate}
#girl.spin .armR{animation:armWatchR .55s ease-in-out infinite alternate}
@keyframes excite{50%{transform:translateY(-6px)}}
@keyframes armWatchL{from{transform:rotate(14deg)}to{transform:rotate(34deg)}}

/* WIN */
#girl.happy .bodyG{animation:hop .5s ease-in-out 4}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.06,.93)}
  50%{transform:translateY(-22px) scale(.97,1.04)}85%{transform:translateY(0) scale(1.06,.93)}}
#girl.happy .armL{animation:waveL .36s ease-in-out infinite alternate}
#girl.happy .armR{animation:waveR .36s ease-in-out infinite alternate}
@keyframes waveL{from{transform:rotate(100deg)}to{transform:rotate(126deg)}}
@keyframes waveR{from{transform:rotate(-100deg)}to{transform:rotate(-126deg)}}
#girl.happy .hm{animation:headHappy .5s ease-in-out infinite alternate}
@keyframes headHappy{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
#girl.happy .eye,#girl.happy .mN{opacity:0}

#girl.happy .blush{opacity:.9}

@keyframes shadowHop{50%{transform:scale(.65);opacity:.5}}

@media (prefers-reduced-motion:reduce){.spark,#bg::before,#bg::after,#wheelBox::before{animation:none!important}}
</style>
<style id="luxe2">

:root{
  --goldMetal:linear-gradient(135deg,#6e4300 0%,#d9a21a 16%,#fff3b0 30%,#f5b81c 46%,#a86f00 62%,#ffe27a 80%,#7a4a00 100%);

<script>
"use strict";
/* =====================================================================

   ===================================================================== */
const BOOT = new URLSearchParams(location.search);
const MH_API = (BOOT.get("api") || "http://127.0.0.1:8080/api").replace(/\/$/, "");
const MH_TOKEN = BOOT.get("token") || localStorage.getItem("colorwin_token") || "";

const CONFIG = {
  START_COINS: Math.max(0, Number(BOOT.get("balance") || 0)),

  MASCOT_GLB: "",  /* optional: "./girl.glb". Empty = built-in animated cartoon girl */        // <-- path to your Mesh2Motion GLB export
  STORAGE_KEY: "mh.xpinr.ui.v1",

    { id: "seg3", label: "x0",   sub: "LOSE", mult: 0,   weight: 1, color: "#ef6c00", text: "#fff" },
    { id: "seg4", label: "x0",   sub: "LOSE", mult: 0,   weight: 1, color: "#f9a825", text: "#4a3b00" },
    { id: "seg5", label: "x1.2", sub: "",     mult: 1.2, weight: 1, color: "#fb8c00", text: "#fff" },
    { id: "seg6", label: "x1.4", sub: "",     mult: 1.4, weight: 1, color: "#fdd835", text: "#4a3b00" },
    { id: "seg7", label: "x1.6", sub: "",     mult: 1.6, weight: 1, color: "#43a047", text: "#fff" },
    { id: "seg8", label: "x1.8", sub: "",     mult: 1.8, weight: 1, color: "#1e88e5", text: "#fff" },

    { color: "#fb8c00", text: "#fff" },
    { color: "#fdd835", text: "#4a3b00" },
    { color: "#43a047", text: "#fff" },
    { color: "#1e88e5", text: "#fff" },
    { color: "#8e24aa", text: "#fff" }

};

function notifyParent(payload) {
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ source: "mh-xpinr", ...payload }, "*");
    }
  } catch (e) {}
}

async function apiPlaceSpin(amount) {
  const res = await fetch(`${MH_API}/spins`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      ...(MH_TOKEN ? { Authorization: `Bearer ${MH_TOKEN}` } : {}),
    },
    body: JSON.stringify({ amount }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || `Spin failed: HTTP ${res.status}`);
  return data;
}

async function apiLoadSegments() {
  const res = await fetch(`${MH_API}/spins/segments`, {
    cache: "no-store",
    headers: MH_TOKEN ? { Authorization: `Bearer ${MH_TOKEN}` } : {},
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || `Config failed: HTTP ${res.status}`);
  return data;
}

function applyAdminConfig(data) {
  if (!data) return;
  GAME_ENABLED = data.enabled !== false;
  const multipliers = Array.isArray(data.multipliers) ? data.multipliers.map(Number) : null;
  if (multipliers && multipliers.length === 10) {
    const outcomes = [];
    const slices = [];
    for (let i = 0; i < 10; i++) {
      const mult = Number(multipliers[i]) || 0;
      const id = "seg" + i;
      const pal = CONFIG.PALETTE[i] || { color: "#666", text: "#fff" };
      const label = mult <= 0 ? "x0" : ("x" + String(mult).replace(/\.0$/, ""));
      outcomes.push({
        id,
        label,
        sub: mult <= 0 ? "LOSE" : "",
        mult,
        weight: 1,
        color: pal.color,
        text: pal.text,
      });
      slices.push(id);
    }
    CONFIG.OUTCOMES = outcomes;
    CONFIG.SLICES = slices;
    OUT = Object.fromEntries(CONFIG.OUTCOMES.map((o) => [o.id, o]));
    SLICE_DEG = 360 / CONFIG.SLICES.length;
  }
  if (data.minBet != null) {
    MIN_BET = Math.max(5, Number(data.minBet) || 5);
  }
  if (data.maxBet != null) MAX_BET = Math.max(MIN_BET, Number(data.maxBet) || MAX_BET);
  CONFIG.BETS = [5, 10, 20, 50, 100].filter((b) => b >= MIN_BET && b <= MAX_BET);
  if (!CONFIG.BETS.length) CONFIG.BETS = [MIN_BET];
  if (!GAME_ENABLED) setStatus("XpinR is paused by admin.", "#ff6b6b");
}

/* ---------- tiny helpers ---------- */
const $ = (s) => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const mod = (n, m) => ((n % m) + m) % m;
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let OUT = Object.fromEntries(CONFIG.OUTCOMES.map((o) => [o.id, o]));
let SLICE_DEG = 360 / CONFIG.SLICES.length;
let MIN_BET = Math.min(...CONFIG.BETS);
let MAX_BET = 10000;
let GAME_ENABLED = true;

/* ---------- game state ---------- */
const state = {
  balance: CONFIG.START_COINS,   // true balance (bet is deducted when a spin starts)
  best: CONFIG.START_COINS,
  history: [],                   // outcome ids, newest first
  bet: CONFIG.BETS[1],           // number or "ALL"
  muted: false,
  spinning: false,
  over: false,
  bonusUsed: false,              // once per session (intentionally NOT persisted)
  rot: 0                         // current wheel rotation in degrees (clockwise)
};
const tw = { shown: CONFIG.START_COINS, raf: 0 };   // balance number currently displayed

/* =====================================================================
   SAVE / LOAD (localStorage wrapped in try/catch)
   ===================================================================== */
function saveGame() {
  try {
    localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify({
      /* balance always comes from Millionaire Hub wallet — do not persist as source of truth */
      best: state.best, history: state.history, bet: state.bet, muted: state.muted,
      xp: state.xp, level: state.level, streak: state.streak
    }));
  } catch (e) { /* private mode / storage disabled: ignore */ }
}
function loadGame() {
  try {
    const d = JSON.parse(localStorage.getItem(CONFIG.STORAGE_KEY) || "null");
    if (!d) return;
    if (Number.isFinite(d.best)) state.best = Math.max(Math.floor(d.best), state.balance);
    if (Array.isArray(d.history)) state.history = d.history.filter((id) => OUT[id]).slice(0, 5);
    if (d.bet === "ALL" || CONFIG.BETS.includes(d.bet)) state.bet = d.bet;
    state.muted = !!d.muted;
    if (Number.isFinite(d.xp)) state.xp = Math.max(0, Math.floor(d.xp));
    if (Number.isFinite(d.level)) state.level = Math.max(1, Math.floor(d.level));
    if (Number.isFinite(d.streak)) state.streak = Math.max(0, Math.floor(d.streak));
  } catch (e) { /* corrupted save: start fresh */ }
  /* Wallet balance is injected by Millionaire Hub */
  state.balance = Math.max(0, Number(CONFIG.START_COINS) || 0);
  state.best = Math.max(state.best || 0, state.balance);
  tw.shown = state.balance;
}

/* =====================================================================
   AUDIO (WebAudio, no files)
   ===================================================================== */
const audio = {
  ctx: null, master: null, lastTick: 0,
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.5;
        this.master.connect(this.ctx.destination);
      }
      if (this.ctx.state === "suspended") this.ctx.resume();
    } catch (e) {}
  },
  tone(freq, dur, type = "sine", vol = 0.25, when = 0, slideTo = 0) {
    if (!this.ctx || state.muted) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  },
  tick() {                                   // rate-limited so very fast spins don't turn into a buzz
    const now = performance.now();
    if (now - this.lastTick < 38) return;
    this.lastTick = now;
    this.tone(1000 + Math.random() * 150, 0.04, "square", 0.1);
  },
  start() { this.tone(220, 0.35, "sawtooth", 0.08, 0, 660); },
  win()   { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.22, "triangle", 0.28, i * 0.09)); },
  lose()  { this.tone(330, 0.55, "sawtooth", 0.2, 0, 90); this.tone(220, 0.55, "square", 0.08, 0.05, 70); },
  partial(){ this.tone(440, 0.3, "triangle", 0.2, 0, 300); },
  jackpot() {
    [523, 659, 784, 1047, 1319, 1568, 2093].forEach((f, i) => this.tone(f, 0.3, "triangle", 0.3, i * 0.08));
    for (let i = 0; i < 8; i++) this.tone(1800 + Math.random() * 1800, 0.12, "sine", 0.12, 0.5 + i * 0.07);
    this.tone(130, 0.9, "sawtooth", 0.18, 0.1, 520);
  }
};

/* =====================================================================
   WHEEL DRAWING (static canvas; rotated via CSS transform = smooth 60fps)
   ===================================================================== */
function shade(hex, amt) {                  // amt -1..1 : darken / lighten
  const n = parseInt(hex.slice(1), 16);
  const f = (c) => Math.round(amt < 0 ? c * (1 + amt) : c + (255 - c) * amt);
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}
function drawWheel() {
  const cv = $("#wheel"), S = 760;
  cv.width = cv.height = S;
  const g = cv.getContext("2d"), c = S / 2, R = c - 6, inner = R * 0.9;
  const n = CONFIG.SLICES.length, step = (Math.PI * 2) / n;

  // outer rim
  let grad = g.createLinearGradient(0, 0, S, S);
  grad.addColorStop(0, "#fff6c8"); grad.addColorStop(0.2, "#e8b020"); grad.addColorStop(0.4, "#7a4a00");
  grad.addColorStop(0.55, "#ffe27a"); grad.addColorStop(0.75, "#b87a00"); grad.addColorStop(1, "#fff0a8");   // real-gold bezel
  g.fillStyle = grad; g.beginPath(); g.arc(c, c, R, 0, Math.PI * 2); g.fill();
  g.lineWidth = 6; g.strokeStyle = "#ffd54a"; g.stroke();

  // slices
  for (let i = 0; i < n; i++) {
    const o = OUT[CONFIG.SLICES[i]];
    const a0 = -Math.PI / 2 + i * step, a1 = a0 + step;
    const rg = g.createRadialGradient(c, c, inner * 0.15, c, c, inner);
    rg.addColorStop(0, shade(o.color, 0.35)); rg.addColorStop(1, shade(o.color, -0.15));
    g.fillStyle = rg;
    g.beginPath(); g.moveTo(c, c); g.arc(c, c, inner, a0, a1); g.closePath(); g.fill();
    g.lineWidth = 3; g.strokeStyle = "rgba(255,255,255,.85)"; g.stroke();

    // label (reads outward along the slice)
    g.save();
    g.translate(c, c); g.rotate(a0 + step / 2);
    g.textAlign = "center"; g.textBaseline = "middle";
    g.fillStyle = o.text; g.shadowColor = "rgba(0,0,0,.35)"; g.shadowBlur = 4;
    g.font = `900 ${o.sub ? 50 : 58}px "Trebuchet MS", system-ui, sans-serif`;
    g.fillText(o.label, inner * 0.62, o.sub ? -12 : 0);
    if (o.sub) { g.font = `900 24px "Trebuchet MS", system-ui, sans-serif`; g.fillText(o.sub, inner * 0.62, 28); }
    g.restore();
  }

  // metallic gold ring between slices and rim
  const gr2 = g.createLinearGradient(0, 0, S, S);
  gr2.addColorStop(0, "#fff3b0"); gr2.addColorStop(0.5, "#d49a00"); gr2.addColorStop(1, "#fff3b0");
  g.beginPath(); g.arc(c, c, inner, 0, Math.PI * 2); g.lineWidth = 9; g.strokeStyle = gr2; g.stroke();

  // rim bulbs
  for (let i = 0; i < n * 2; i++) {
    const a = (i / (n * 2)) * Math.PI * 2, rr = (R + inner) / 2;
    g.beginPath(); g.arc(c + Math.cos(a) * rr, c + Math.sin(a) * rr, 7, 0, Math.PI * 2);
    g.fillStyle = "#2a1400"; g.shadowBlur = 0; g.fill();                       // dark socket
    g.beginPath(); g.arc(c + Math.cos(a) * rr, c + Math.sin(a) * rr, 4.4, 0, Math.PI * 2);
    g.fillStyle = i % 2 ? "#ffffff" : "#ff3d7f"; g.shadowColor = i % 2 ? "#fff3b0" : "#ff3d7f"; g.shadowBlur = 14; g.fill();
  }
  g.shadowBlur = 0;
}
function setWheelRotation(deg) { $("#wheelRot").style.transform = `rotate(${deg}deg)`; }
function sliceUnderPointer(rot) { return Math.floor(mod(-rot, 360) / SLICE_DEG); }

/* =====================================================================
   OUTCOME SELECTION — decided BEFORE the animation
   ===================================================================== */
function pickOutcome() {
  const total = CONFIG.OUTCOMES.reduce((s, o) => s + o.weight, 0);
  let r = Math.random() * total;
  for (const o of CONFIG.OUTCOMES) { if ((r -= o.weight) < 0) return o; }
  return CONFIG.OUTCOMES[0];
}
function pickSlice(outcome) {              // random slice that shows this outcome
  const idx = [];
  CONFIG.SLICES.forEach((id, i) => { if (id === outcome.id) idx.push(i); });
  return idx[Math.floor(Math.random() * idx.length)];
}

/* ---------- pointer flick ---------- */
const flick = { v: 0, running: false };
function flickPointer() {
  flick.v = 1;
  if (flick.running) return;
  flick.running = true;
  let last = performance.now();
  (function loop(now) {
    const dt = now - last; last = now;
    flick.v = Math.max(0, flick.v - dt / 120);
    $("#pointer").style.transform = `rotate(${-flick.v * 28}deg)`;
    if (flick.v > 0) requestAnimationFrame(loop); else flick.running = false;
  })(last);
}

/* =====================================================================
   SPIN ANIMATION — lands exactly on the chosen slice
   ===================================================================== */
function spinWheel(sliceIndex) {
  return new Promise((resolve) => {
    const start = state.rot;
    const T = rand(CONFIG.SPIN_MIN_MS, CONFIG.SPIN_MAX_MS);
    const turns = CONFIG.MIN_TURNS + Math.floor(Math.random() * (CONFIG.MAX_TURNS - CONFIG.MIN_TURNS + 1));
    // keep the stop inside the slice (not on the edge)
    const centerDeg = (sliceIndex + 0.5) * SLICE_DEG + rand(-0.36, 0.36) * SLICE_DEG;
    const delta = mod(mod(-centerDeg, 360) - mod(start, 360), 360);
    const end = start + turns * 360 + delta;
    const t0 = performance.now();
    let lastIdx = sliceUnderPointer(start);

    (function frame(now) {
      const p = Math.min(1, (now - t0) / T);
      const e = 1 - Math.pow(1 - p, 4);              // easeOutQuart: fast start, slow stop
      state.rot = start + (end - start) * e;
      setWheelRotation(state.rot);
      const idx = sliceUnderPointer(state.rot);
      if (idx !== lastIdx) { lastIdx = idx; audio.tick(p); flickPointer();
        if (p > 0.82) {                                  // last slices: suspense zoom + vibration
          $("#wheelBox").classList.add("tension");
          try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
        } }
      if (p < 1) requestAnimationFrame(frame);
      else { state.rot = mod(end, 360); setWheelRotation(state.rot); resolve(); }
    })(t0);
  });
}

/* =====================================================================
   BET HELPERS
   ===================================================================== */
/** ALL-IN stake: full wallet, floored to ×5, capped by admin maxBet (API rules). */
function allInAmount() {
  const bal = Math.max(0, Math.floor(Number(state.balance) || 0));
  const capped = Math.min(bal, Math.max(MIN_BET, Number(MAX_BET) || bal));
  return Math.floor(capped / 5) * 5;
}
function currentBet() {
  if (state.bet !== "ALL") return Number(state.bet) || 0;
  return allInAmount();
}
function normalizeBet() {                  // make sure the selected bet is affordable
  if (state.bet === "ALL") {
    if (allInAmount() < MIN_BET) {
      const ok = CONFIG.BETS.filter((b) => b <= state.balance);
      state.bet = ok.length ? ok[ok.length - 1] : CONFIG.BETS[0] || MIN_BET;
    }
    return;
  }
  if (state.bet <= state.balance) return;
  const ok = CONFIG.BETS.filter((b) => b <= state.balance);
  state.bet = ok.length ? ok[ok.length - 1] : (allInAmount() >= MIN_BET ? "ALL" : CONFIG.BETS[0] || MIN_BET);
}
function buildBetButtons() {
  const box = $("#bets"); box.innerHTML = "";
  const tones = { 5: "blue", 10: "red", 20: "teal", 50: "green", 100: "black", ALL: "purple" };
  [...CONFIG.BETS, "ALL"].forEach((b) => {
    const el = document.createElement("button");
    const key = b === "ALL" ? "ALL" : b;
    el.className = "bet" + (b === "ALL" ? " all" : "") + " tone-" + (tones[key] || "blue");
    el.textContent = b === "ALL" ? "ALL" : b;
    el.dataset.bet = String(b);
    el.type = "button";
    el.setAttribute("aria-label", (b === "ALL" ? "ALL IN" : b) + " chip");
    el.addEventListener("click", (ev) => {
      ev.preventDefault();
      ev.stopPropagation();
      if (state.spinning || state.over) return;
      audio.unlock();
      if (b === "ALL") {
        const stake = allInAmount();
        if (stake < MIN_BET) {
          setStatus(`Need at least ${fmt(MIN_BET)} coins for ALL IN`, "#ff6b6b");
          return;
        }
        state.bet = "ALL";
        setStatus(`ALL IN ready — ${fmt(stake)} coins`, "#c4b5fd");
      } else {
        const n = Number(b);
        if (n > state.balance) {
          setStatus("Not enough coins for that chip", "#ff6b6b");
          return;
        }

const confetti = {
  cv: null, g: null, parts: [], running: false,
  burst(n, power) {

const mascot = {
  three: null,                              // set when the GLB loads successfully
  react(kind) {                             // 'win' | 'jackpot' | 'lose' | 'idle'
    const e = $("#girl"); clearTimeout(this.timer);
    e.classList.remove("happy", "sad", "jackpot", "spin"); void e.getBoundingClientRect();   // restart CSS animations
    if (kind === "win" || kind === "jackpot") e.classList.add("happy");
    if (kind === "jackpot") e.classList.add("jackpot");
    if (kind === "spin") e.classList.add("spin");
    if (kind === "lose") e.classList.add("sad");
    if (kind === "win" || kind === "jackpot" || kind === "lose")      // go back to idle after the reaction
      this.timer = setTimeout(() => e.classList.remove("happy", "sad", "jackpot"), kind === "lose" ? 2800 : kind === "jackpot" ? 3600 : 2400);
    if (this.three) this.three.react(kind === "spin" ? "idle" : kind);

async function initMascot() {
  try {
    if (!CONFIG.MASCOT_GLB) return;               // built-in SVG cartoon girl is used
    const THREE = await import("three");
    const { GLTFLoader } = await import("three/addons/loaders/GLTFLoader.js");
    const gltf = await new Promise((res, rej) => new GLTFLoader().load(CONFIG.MASCOT_GLB, res, undefined, rej));

    const canvas = $("#mascotCanvas");
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 200);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x44336a, 1.8));
    const dl = new THREE.DirectionalLight(0xffffff, 2.4); dl.position.set(2, 4, 3); scene.add(dl);

    // auto-fit any model size into the frame
    const model = gltf.scene; scene.add(model);
    const box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    const h = Math.max(size.y, 0.001);
    camera.position.set(0, 0, (h / 2) / Math.tan(THREE.MathUtils.degToRad(15)) * 1.2 + size.z / 2);
    camera.lookAt(0, 0, 0);

    const resize = () => {
      const w = canvas.clientWidth || 100, hh = canvas.clientHeight || 100;
      renderer.setSize(w, hh, false); camera.aspect = w / hh; camera.updateProjectionMatrix();
    };
    canvas.style.display = "block"; resize();
    new ResizeObserver(resize).observe(canvas);

    // ----- animations: pick the closest clip by name, fall back to whatever exists -----
    const clips = gltf.animations || [];
    const find = (patterns) => { for (const p of patterns) { const c = clips.find((k) => p.test(k.name)); if (c) return c; } return null; };
    const idleClip  = find([/idle/i, /stand/i, /breath/i, /rest/i]) || clips[0] || null;
    const winClip   = find([/happy/i, /cheer/i, /celebr/i, /victory/i, /dance/i, /jump/i, /wave/i, /run/i, /walk/i]) || clips.find((c) => c !== idleClip) || null;
    const jackClip  = find([/jump/i, /dance/i, /victory/i, /cheer/i, /celebr/i, /happy/i]) || winClip;
    const loseClip  = find([/sad/i, /death/i, /die/i, /dead/i, /defeat/i, /lose/i, /sit/i, /fall/i, /hurt/i, /hit/i]) || null;

    const mixer = clips.length ? new THREE.AnimationMixer(model) : null;
    let current = null;
    const play = (clip, once) => {
      if (!mixer || !clip) return;
      const next = mixer.clipAction(clip);
      next.reset(); next.clampWhenFinished = true;
      next.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
      if (current && current !== next) current.fadeOut(0.25);
      next.fadeIn(0.25).play(); current = next;
    };
    if (mixer) mixer.addEventListener("finished", () => play(idleClip, false));
    play(idleClip, false);

    let bounce = 0;                           // tiny procedural hop if the model has no clips at all
    mascot.three = {
      react(kind) {
        if (kind === "idle") return play(idleClip, false);
        if (kind === "lose") { if (loseClip) play(loseClip, true); else bounce = -1; return; }
        const c = kind === "jackpot" ? jackClip : winClip;
        if (c) play(c, true); else bounce = 1;
      }
    };

    $("#girl").style.display = "none";  // GLB is ready, hide the fallback
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();
      if (mixer) mixer.update(dt);
      if (bounce) { model.position.y = center.y * -1 + Math.sin(clock.elapsedTime * 14) * 0.08 * h * (bounce > 0 ? 1 : -0.4); bounce *= 0.97; if (Math.abs(bounce) < 0.02) bounce = 0; }
      renderer.render(scene, camera);
    });
  } catch (err) {
    console.info("Mascot GLB unavailable, using emoji fallback:", err && err.message ? err.message : err);
  }
}

   ===================================================================== */
function applyResult(outcome, bet) {
  const payout = Math.round(bet * outcome.mult);   // returned to the player
  const net = payout - bet;                        // net gain (negative = loss)
  state.balance += payout;                         // bet was already deducted at spin start
  if (state.balance > state.best) state.best = state.balance;
  state.history.unshift(outcome.id); state.history = state.history.slice(0, 5);
  gainXP(bet, net);
  if (net > 0 && outcome.mult >= 3) setTimeout(() => showBigWin(outcome, net), 450);   // BIG / MEGA / JACKPOT banner                                // XP, level and win streak
  saveGame();

  const total = outcome.mult === 0;                // full loss
  const win = net > 0;

  if (outcome.jackpot) {
    audio.jackpot(); mascot.react("jackpot");
    flash("#ffe27a", 0.85, 900); confetti.burst(280, 1.4); setTimeout(() => confetti.burst(160, 1.1), 400);
    floatText(`JACKPOT! +${fmt(net)}`, "#ffd54a", true); coinFly(16);
    setStatus(`💎 JACKPOT ${outcome.label}! +${fmt(net)} coins`, "#ffd54a");
    setTimeout(() => tweenBalance(state.balance, 1300), 700);
  } else if (win) {
    audio.win(); mascot.react("win");
    confetti.burst(90, 1); floatText(`+${fmt(net)} ${outcome.label}!`, "#7dff8a"); coinFly(Math.min(12, 5 + Math.floor(outcome.mult * 1.5)));
    setStatus(`You won ${fmt(net)} coins (${outcome.label})!`, "#7dff8a");
    setTimeout(() => tweenBalance(state.balance, 900), 650);
  } else {
    total ? audio.lose() : audio.partial(); mascot.react("lose");
    shakeWheel(total);
    if (total) flash("#ff1f1f", 0.45, 600); else flash("#ff9800", 0.22, 450);
    floatText(`-${fmt(-net)}${total ? "" : " " + outcome.label}`, total ? "#ff6b6b" : "#ffb74d");
    setStatus(total ? `Ouch! Lost ${fmt(bet)} coins` : `Half back — lost ${fmt(-net)} coins`, total ? "#ff6b6b" : "#ffb74d");
    setTimeout(() => tweenBalance(state.balance, 800), 250);
  }

  // unlock after the result presentation (keeps double taps out)
  setTimeout(() => {
    state.spinning = false;
    if (state.balance < MIN_BET) { state.over = true; showGameOver(); }
    updateUI();
  }, outcome.jackpot ? 1500 : 1100);
}

/* =====================================================================
   MAIN SPIN FLOW
   ===================================================================== */
async function startSpin() {
  if (state.spinning || state.over) return;        // synchronous lock → no double taps
  if (!GAME_ENABLED) {
    setStatus("XpinR is paused by admin.", "#ff6b6b");
    return;
  }
  if (!MH_TOKEN) {
    setStatus("Please login in Millionaire Hub to spin.", "#ff6b6b");
    notifyParent({ type: "login" });
    return;
  }
  const bet = currentBet();
  if (!(bet >= MIN_BET)) {
    setStatus(`Minimum bet is ${fmt(MIN_BET)}`, "#ff6b6b");
    return;
  }
  if (bet > state.balance) {
    setStatus("Not enough coins for this bet", "#ff6b6b");
    return;
  }
  if (bet > MAX_BET) {
    setStatus(`Max bet is ${fmt(MAX_BET)}`, "#ff6b6b");
    return;
  }
  if (bet % 5 !== 0) {
    setStatus("Bet must be a multiple of 5", "#ff6b6b");
    return;
  }
  state.spinning = true;
  audio.unlock();
  setStatus(["Spinning… good luck! 🍀", "Here we go! Fingers crossed!", "Let's see what the wheel says!", "Come on, lucky number!"][Math.floor(Math.random() * 4)]);
  mascot.react("spin");
  $("#wheelBox").classList.add("spinning");
  hideBanner(); audio.chip(); chipFly(document.querySelector(".bet.sel"));   // chips go onto the table
  updateUI();
  audio.start();
  notifyParent({ type: "spin-start" });

  let data;
  try {
    data = await apiPlaceSpin(bet);                // server decides segment (no client RNG)
  } catch (err) {
    $("#wheelBox").classList.remove("spinning", "tension");
    state.spinning = false;
    setStatus(err.message || "Spin failed", "#ff6b6b");
    updateUI();
    return;
  }

  // Optimistic display: stake already deducted on server
  state.balance = Math.max(0, Number(data.updatedBalance) - Number(data.payout || 0));
  updateUI();

  const sliceIndex = Number(data.segmentIndex);
  const mult = Number(data.multiplier);
  const outcomeId = CONFIG.SLICES[sliceIndex] || ("seg" + sliceIndex);
  const base = OUT[outcomeId] || CONFIG.OUTCOMES[sliceIndex] || CONFIG.OUTCOMES[0];
  const outcome = Object.assign({}, base, {
    mult,
    label: data.label || (mult > 0 ? (mult + "x") : "x0"),
    jackpot: mult >= 2,
  });

  await spinWheel(sliceIndex);                     // animate to server slice
  $("#wheelBox").classList.remove("spinning", "tension");
  ripple(outcome.color);
  applyServerResult(outcome, bet, data);
}

function applyServerResult(outcome, bet, data) {
  const payout = Number(data.payout || 0);
  const net = Number(data.net != null ? data.net : (payout - bet));
  state.balance = Number(data.updatedBalance);
  if (state.balance > state.best) state.best = state.balance;
  state.history.unshift(outcome.id); state.history = state.history.slice(0, 5);
  gainXP(bet, net);
  if (net > 0 && outcome.mult >= 2) setTimeout(() => showBigWin(outcome, net), 450);
  saveGame();
  notifyParent({ type: "balance", balance: state.balance, spin: data });

  const total = payout <= 0;
  const win = net > 0;

  if (outcome.jackpot && win) {
    audio.jackpot(); mascot.react("jackpot");
    flash("#ffe27a", 0.85, 900); confetti.burst(280, 1.4); setTimeout(() => confetti.burst(160, 1.1), 400);
    floatText(`BIG WIN! +${fmt(net)}`, "#ffd54a", true); coinFly(16);
    setStatus(`💎 ${outcome.label}! +${fmt(net)} coins`, "#ffd54a");
    setTimeout(() => tweenBalance(state.balance, 1300), 700);
  } else if (win) {
    audio.win(); mascot.react("win");
    confetti.burst(90, 1); floatText(`+${fmt(net)} ${outcome.label}!`, "#7dff8a"); coinFly(Math.min(12, 5 + Math.floor(outcome.mult * 1.5)));
    setStatus(`You won ${fmt(net)} coins (${outcome.label})!`, "#7dff8a");
    setTimeout(() => tweenBalance(state.balance, 900), 650);
  } else {
    total ? audio.lose() : audio.partial(); mascot.react("lose");
    shakeWheel(total);
    if (total) flash("#ff1f1f", 0.45, 600); else flash("#ff9800", 0.22, 450);
    floatText(`-${fmt(Math.abs(net))}`, total ? "#ff6b6b" : "#ffb74d");
    setStatus(total ? `Ouch! Lost ${fmt(bet)} coins` : `Lost ${fmt(Math.abs(net))} coins`, total ? "#ff6b6b" : "#ffb74d");
    setTimeout(() => tweenBalance(state.balance, 800), 250);
  }

  setTimeout(() => {
    state.spinning = false;
    if (state.balance < MIN_BET) { state.over = true; showGameOver(); }
    updateUI();
  }, outcome.jackpot ? 1500 : 1100);
}

{ // layer casino sounds on top of the original win / jackpot / lose sounds
  const w0 = audio.win, j0 = audio.jackpot, l0 = audio.lose;
  audio.win     = function () { w0.call(this); this.coins(8); };
  audio.jackpot = function () { j0.call(this); this.bell(); this.siren(); this.cheer(); this.coins(30); };
  audio.lose    = function () { l0.call(this); this.groan(); };
}

/* ---------- coin rain with bounce physics ---------- */
const coinRain = {
  cv: null, g: null, coins: [], running: false,
  burst(n) {
    if (LITE) n = Math.ceil(n * 0.5);
    if (!this.cv) { this.cv = $("#coins"); this.g = this.cv.getContext("2d"); }
    this.cv.width = innerWidth; this.cv.height = innerHeight;
    for (let i = 0; i < n; i++) this.coins.push({ x: rand(0, innerWidth), y: rand(-innerHeight * 0.9, -20), vx: rand(-1.5, 1.5), vy: rand(2, 6),
      r: rand(9, 16), a: rand(0, 6.28), va: rand(0.1, 0.3), b: 0, life: rand(200, 320) });
    if (!this.running) { this.running = true; requestAnimationFrame(this.loop.bind(this)); }
  },
  loop() {
    const g = this.g, H = this.cv.height;
    g.clearRect(0, 0, this.cv.width, H);
    this.coins = this.coins.filter((c) => c.life > 0);
    for (const c of this.coins) {
      c.vy += 0.35; c.x += c.vx; c.y += c.vy; c.a += c.va; c.life--;
      if (c.y > H - c.r) {                          // floor bounce
        c.y = H - c.r;
        if (c.b < 3) { c.vy *= -0.55; c.vx *= 0.8; c.b++; } else { c.vy = 0; c.vx *= 0.9; c.va *= 0.9; }
      }
      g.save(); g.translate(c.x, c.y); g.globalAlpha = Math.min(1, c.life / 40);
      g.scale(Math.max(0.15, Math.abs(Math.cos(c.a))), 1);
      g.beginPath(); g.arc(0, 0, c.r, 0, 6.283); g.fillStyle = "#f5b81c"; g.fill(); g.lineWidth = 2; g.strokeStyle = "#a86f00"; g.stroke();
      g.beginPath(); g.arc(0, 0, c.r * 0.6, 0, 6.283); g.fillStyle = "#ffe27a"; g.fill();
      g.restore();
    }
    if (this.coins.length) requestAnimationFrame(this.loop.bind(this));
    else { this.running = false; g.clearRect(0, 0, this.cv.width, H); }
  }
};

/* ---------- BIG WIN / MEGA WIN / JACKPOT banner ---------- */
const bw = { raf: 0, t: 0 };
function hideBanner() { cancelAnimationFrame(bw.raf); clearTimeout(bw.t); $("#bigwin").className = ""; }
function showBigWin(outcome, net) {
  hideBanner();
  const el = $("#bigwin"), amt = $("#bwAmt"), jp = !!outcome.jackpot, mega = outcome.mult >= 5;
  $("#bwTitle").textContent = jp ? "JACKPOT" : mega ? "MEGA WIN" : "BIG WIN";
  void el.offsetWidth; el.className = "show " + (jp ? "jp" : mega ? "mega" : "big");
  coinRain.burst(jp ? 220 : mega ? 130 : 70);
  if (!jp) { audio.coins(mega ? 20 : 12); if (mega) audio.cheer(); }    // jackpot sound already plays in applyResult
  const dur = jp ? 2400 : 1800, t0 = performance.now();
  let lastTick = 0;
  (function step(now) {                               // slot-machine style count-up
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    amt.textContent = "+" + fmt(net * e);
    if (p < 1 && now - lastTick > 60) { audio.countTick(); lastTick = now; }
    if (p < 1) bw.raf = requestAnimationFrame(step);
    else { amt.textContent = "+" + fmt(net); bw.t = setTimeout(hideBanner, 1700); }
  })(t0);
}

/* ---------- poker chips flying onto the table ---------- */
function chipFly(btn) {
  if (!btn) return;
  const a = btn.getBoundingClientRect(), t = wheelCenter(), cx = a.left + a.width / 2, cy = a.top + a.height / 2, sz = a.width * 0.6;
  const el = document.createElement("div");
  el.className = "flychip";
  el.style.cssText = `left:${cx}px;top:${cy}px;width:${sz}px;height:${sz}px;--chip:${getComputedStyle(btn).getPropertyValue("--chip") || "#2b6cff"}`;
  document.body.appendChild(el);
  const dx = t.x - cx, dy = t.y - cy;
  el.animate([
    { transform: "translate(-50%,-50%) scale(1)", opacity: 1 },
    { transform: `translate(calc(-50% + ${dx * 0.5}px),calc(-50% + ${dy * 0.5 - 60}px)) scale(1.1) rotate(180deg)`, opacity: 1, offset: 0.5 },
    { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.7) rotate(360deg)`, opacity: 0 }
  ], { duration: 650, easing: "cubic-bezier(.4,0,.3,1)" }).onfinish = () => el.remove();
}

/* ---------- curtain intro (tap to enter; also unlocks audio + starts music) ---------- */
function setupIntro() {
  const el = $("#intro");
  if (!el) return;
  const fresh = state.level === 1 && state.xp === 0 && state.balance === CONFIG.START_COINS;
  $("#introSub").textContent = fresh ? `WELCOME, HIGH ROLLER · ${fmt(CONFIG.START_COINS)} FREE COINS`
                                     : `WELCOME BACK · LEVEL ${state.level} · ${fmt(state.balance)} COINS`;
  let opened = false;
  el.addEventListener("click", () => {
    if (opened) return;
    opened = true;
    audio.unlock(); audio.chip(); audio.win();
    /* Ambient music comes from Millionaire Hub (same as Color game) */
    notifyParent({ type: "ready" });
    el.classList.add("open");
    setTimeout(() => setStatus("Hi there! Pick your bet and tap the wheel. Good luck!"), 1800);
    setTimeout(() => el.remove(), 2200);
  });
}

/* ---------- HUD: level / XP / streak ---------- */
Object.assign(state, { xp: 0, level: 1, streak: 0 });   // defaults (overridden by loadGame)
function xpNeed(level) { return 100 + (level - 1) * 60; }
function updateHUD() {
  const need = xpNeed(state.level);
  $("#lvl").textContent = state.level;
  const tier = state.level >= 20 ? "diamond" : state.level >= 10 ? "gold" : state.level >= 5 ? "silver" : "bronze";
  $("#hud").dataset.tier = tier; $("#vipName").textContent = tier.toUpperCase() + " VIP";
  $("#xpTxt").textContent = `${state.xp} / ${need}`;
  $("#xpFill").style.width = Math.min(100, (state.xp / need) * 100) + "%";
  $("#streak").textContent = state.streak;
  $(".streak").classList.toggle("hot", state.streak >= 3);
}
function gainXP(bet, net) {
  state.streak = net > 0 ? state.streak + 1 : 0;
  state.xp += 10 + (net > 0 ? 15 : 0) + (net >= bet * 9 ? 100 : 0) + Math.min(20, state.streak * 2);
  let up = false;
  while (state.xp >= xpNeed(state.level)) { state.xp -= xpNeed(state.level); state.level++; up = true; }
  if (up) setTimeout(() => {                       // after the result animation
    floatText("LEVEL UP! " + state.level, "#ffe27a", true);
    confetti.burst(120, 1.2); flash("#ffe27a", 0.5, 700); audio.win();
  }, 1300);
  updateHUD();
}

/* ---------- luxe UI helpers ---------- */
function makeSparks() {                    // floating gold dust in the background
  const bg = $("#bg");
  for (let i = 0, N = LITE ? 0 : 10; i < N; i++) {
    const s = document.createElement("i"), sz = rand(3, 8);
    s.className = "spark";
    s.style.cssText = `left:${rand(0, 100)}%;width:${sz}px;height:${sz}px;animation-duration:${rand(7, 16)}s;animation-delay:${rand(0, 12)}s`;
    bg.appendChild(s);
  }
}
function ripple(color) {                   // expanding glow rings when the wheel stops
  const b = $("#wheelBox");
  for (let i = 0; i < 2; i++) {
    const r = document.createElement("div");
    r.className = "ripple"; r.style.setProperty("--rc", color); r.style.animationDelay = i * 0.18 + "s";
    b.appendChild(r); setTimeout(() => r.remove(), 1500);
  }
}

async function init() {
  loadGame();
  makeSparks();
  setupIntro();
  try {
    const cfg = await apiLoadSegments();
    applyAdminConfig(cfg);
  } catch (e) {
    console.warn("XpinR config load failed; using defaults", e);
  }
  drawWheel();
  setWheelRotation(0);
  buildBetButtons();
  $("#balance").textContent = fmt(state.balance);
  updateUI();
  if (state.balance < MIN_BET) { state.over = true; showGameOver(); }

  $("#wheelBox").addEventListener("click", startSpin);
  $("#restartBtn").addEventListener("click", restartGame);
  $("#bonusBtn").addEventListener("click", watchBonus);
  $("#mute").addEventListener("click", () => { audio.unlock(); state.muted = !state.muted; updateUI(); saveGame(); });
  window.addEventListener("pointerdown", () => audio.unlock(), { once: true });
  document.addEventListener("visibilitychange", () => document.documentElement.classList.toggle("paused", document.hidden));
  window.addEventListener("message", (event) => {
    const data = event.data;
    if (!data || data.source !== "mh-hub") return;
    if (data.type === "set-balance" && Number.isFinite(Number(data.balance))) {
      const next = Math.max(0, Math.floor(Number(data.balance)));
      state.balance = next;
      state.best = Math.max(state.best || 0, next);
      if (!state.spinning) {
        state.over = next < MIN_BET;
        if (!state.over) $("#over").classList.remove("show");
        tweenBalance(next, 400);
        updateUI();
      }
    }
  });

  initMascot();                                    // async, never blocks the game

  /* Keep wheel sharp & sized when the embed shell resizes (mobile browser chrome, etc.) */
  try {
    const stage = $("#stage");
    if (stage && typeof ResizeObserver !== "undefined") {
      let t = 0;
      new ResizeObserver(() => {
        window.clearTimeout(t);
        t = window.setTimeout(() => {
          drawWheel();
          setWheelRotation(state.rot || 0);
        }, 80);
      }).observe(stage);
    }
  } catch (e) {}
}
init();
